<style>
  :root{ --bg:#1a1815; --cream:#e8dcc4; --muted:#a49d8c; --line:rgba(232,220,196,.16); }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);overflow-x:hidden;font-family:'Oswald',sans-serif;color:var(--cream)}
  img{display:block}
  a{color:inherit;text-decoration:none}

  /* ===== TOP NAV (website menu) ===== */
  nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    height:64px;padding:0 clamp(18px,3vw,40px);
    background:rgba(26,24,21,.55);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:.35s}
  nav.solid{background:rgba(26,24,21,.92);border-bottom:1px solid var(--line)}
  .logo{font-weight:700;font-size:19px;letter-spacing:1px;color:var(--cream);text-transform:uppercase}
  .logo span{color:var(--muted);font-weight:400}
  .menu{display:flex;gap:clamp(16px,2.2vw,34px)}
  .menu a{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;position:relative;transition:.2s;padding:4px 0}
  .menu a::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:1.5px;background:var(--cream);transition:.28s}
  .menu a:hover,.menu a.active{color:var(--cream)}
  .menu a:hover::after,.menu a.active::after{width:100%}
  .nav-cta{border:1px solid var(--cream);border-radius:100px;padding:8px 18px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cream);transition:.25s}
  .nav-cta:hover{background:var(--cream);color:var(--bg)}
  .burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
  .burger span{width:24px;height:2px;background:var(--cream);border-radius:2px;transition:.3s}
  .nav-right{display:flex;align-items:center;gap:22px}
  @media(max-width:820px){
    .menu,.nav-cta{display:none}
    .burger{display:flex}
  }

  /* mobile drawer */
  .drawer{position:fixed;inset:0;z-index:70;background:rgba(20,18,16,.98);backdrop-filter:blur(6px);
    transform:translateX(100%);transition:.4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:26px}
  .drawer.open{transform:none}
  .drawer .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
  .drawer .close{background:none;border:none;color:var(--cream);font-size:34px;cursor:pointer;line-height:1}
  .drawer a{color:var(--cream);font-size:22px;letter-spacing:1px;text-transform:uppercase;padding:15px 0;border-bottom:1px solid var(--line)}

  /* progress bar under nav */
  .prog{position:fixed;top:64px;left:0;height:2px;width:0;background:var(--cream);z-index:59;transition:width .12s linear}

  /* ===== FULL-SCREEN SLIDES ===== */
  .deck{scroll-snap-type:y mandatory}
  .slide{width:100vw;height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden;position:relative}
  .slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}

  /* slide counter */
  .counter{position:fixed;bottom:20px;right:24px;z-index:55;color:var(--cream);font-size:13px;letter-spacing:2px;font-weight:600;mix-blend-mode:difference;pointer-events:none}
  .counter b{font-size:19px}

  /* dot navigation */
  .dots{position:fixed;top:50%;right:18px;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:10px}
  .dots a{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(232,220,196,.5);transition:.25s}
  .dots a:hover{border-color:var(--cream)}
  .dots a.active{background:var(--cream);border-color:var(--cream);transform:scale(1.25)}
  @media(max-width:820px){.dots{display:none}}

  /* scroll hint */
  .hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:55;color:var(--cream);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.7;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.4s;mix-blend-mode:difference}
  .hint.hide{opacity:0;pointer-events:none}
  .hint .m{width:20px;height:32px;border:1.5px solid var(--cream);border-radius:12px;position:relative}
  .hint .m::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:3px;height:6px;border-radius:2px;background:var(--cream);animation:sc 1.6s infinite}
  @keyframes sc{0%{opacity:0;transform:translate(-50%,0)}40%{opacity:1}80%{opacity:0;transform:translate(-50%,10px)}}
  @media(prefers-reduced-motion:reduce){.hint .m::after{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav id="nav">
  <a href="#s1" class="logo">LINH<span>.HR</span></a>
  <div class="menu" id="menu">
    <a href="#s3">Intro</a>
    <a href="#s4">About</a>
    <a href="#s5">Education</a>
    <a href="#s6">Skills</a>
    <a href="#s7">Experience</a>
    <a href="#s8">Portfolio</a>
  </div>
  <div class="nav-right">
    <a href="#s12" class="nav-cta">Contact</a>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="drawer" id="drawer">
  <div class="dtop">
    <span class="logo">LINH<span>.HR</span></span>
    <button class="close" id="dclose" aria-label="Close">×</button>
  </div>
  <a href="#s3" data-close>Intro</a>
  <a href="#s4" data-close>About</a>
  <a href="#s5" data-close>Education</a>
  <a href="#s6" data-close>Skills</a>
  <a href="#s7" data-close>Experience</a>
  <a href="#s8" data-close>Portfolio</a>
  <a href="#s12" data-close>Contact</a>
</div>

<div class="prog" id="prog"></div>

<div class="deck" id="deck">
  <section class="slide" id="s1"><img src="anna-slides/1.svg" alt="Cover" loading="eager"></section>
  <section class="slide" id="s2"><img src="anna-slides/2.svg" alt="Table of contents" loading="lazy"></section>
  <section class="slide" id="s3"><img src="anna-slides/3.svg" alt="Introduction" loading="lazy"></section>
  <section class="slide" id="s4"><img src="anna-slides/4.svg" alt="About me" loading="lazy"></section>
  <section class="slide" id="s5"><img src="anna-slides/5.svg" alt="Education" loading="lazy"></section>
  <section class="slide" id="s6"><img src="anna-slides/6.svg" alt="Personal skills" loading="lazy"></section>
  <section class="slide" id="s7"><img src="anna-slides/7.svg" alt="Work experience" loading="lazy"></section>
  <section class="slide" id="s8"><img src="anna-slides/8.svg" alt="Project portfolio" loading="lazy"></section>
  <section class="slide" id="s9"><img src="anna-slides/9.svg" alt="First project" loading="lazy"></section>
  <section class="slide" id="s10"><img src="anna-slides/10.svg" alt="Second project" loading="lazy"></section>
  <section class="slide" id="s11"><img src="anna-slides/11.svg" alt="Best project" loading="lazy"></section>
  <section class="slide" id="s12"><img src="anna-slides/12.svg" alt="Thank you" loading="lazy"></section>
</div>

<div class="dots" id="dots"></div>
<div class="counter" id="counter"><b>01</b> / 12</div>
<div class="hint" id="hint"><span>Scroll</span><span class="m"></span></div>

<script>
const slides=[...document.querySelectorAll('.slide')];
const nav=document.getElementById('nav');
const prog=document.getElementById('prog');
const counter=document.getElementById('counter');
const hint=document.getElementById('hint');
const dotsWrap=document.getElementById('dots');
const menuLinks=[...document.querySelectorAll('.menu a')];

// build dots
slides.forEach((s,i)=>{const a=document.createElement('a');a.href='#'+s.id;a.setAttribute('aria-label','Slide '+(i+1));dotsWrap.appendChild(a);});
const dots=[...dotsWrap.children];

// mobile drawer
const drawer=document.getElementById('drawer');
document.getElementById('burger').onclick=()=>drawer.classList.add('open');
document.getElementById('dclose').onclick=()=>drawer.classList.remove('open');
document.querySelectorAll('[data-close]').forEach(a=>a.onclick=()=>drawer.classList.remove('open'));

// scroll: progress + nav solid + hide hint
addEventListener('scroll',()=>{
  const h=document.documentElement;
  const sc=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  prog.style.width=(sc*100)+'%';
  nav.classList.toggle('solid',h.scrollTop>40);
  hint.classList.toggle('hide',h.scrollTop>60);
},{passive:true});

// active slide detection -> dots, counter, menu highlight
const io=new IntersectionObserver(es=>{
  es.forEach(x=>{
    if(x.isIntersecting){
      const i=slides.indexOf(x.target);
      dots.forEach((d,j)=>d.classList.toggle('active',j===i));
      counter.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / 12';
      const id=x.target.id;
      menuLinks.forEach(m=>m.classList.toggle('active',m.getAttribute('href')==='#'+id));
    }
  });
},{threshold:.55});
slides.forEach(s=>io.observe(s));
</script>
</body>
</html>
